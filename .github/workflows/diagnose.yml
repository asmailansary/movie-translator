# اختبار تشخيص: هل يقدر GitHub يحمّل من يوتيوب (مباشرة / عن طريق WARP)؟
name: diagnose
run-name: تشخيص التحميل

on:
  workflow_dispatch:
    inputs:
      video_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -q -U "yt-dlp[default]" "urllib3[socks]"
      - name: WARP
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/cloudflare-client.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y -qq --no-install-recommends cloudflare-warp
          sudo systemctl start warp-svc || true
          for i in $(seq 1 10); do warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 1; done
          warp-cli --accept-tos registration new || echo "::warning::registration: failed"
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          echo "::notice::warp status: $(warp-cli --accept-tos status | tr '\n' ' ' | cut -c1-150)"
          echo "::notice::warp trace: $(curl -s -m 15 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'warp|loc' | tr '\n' ' ')"
      - name: Test downloads
        env:
          VID: ${{ inputs.video_id }}
        run: |
          [[ "$VID" =~ ^[A-Za-z0-9_-]{11}$ ]] || exit 1
          U="https://www.youtube.com/watch?v=$VID"
          for mode in direct warp; do
            P=""; [ "$mode" = warp ] && P="--proxy socks5://127.0.0.1:40000"
            OUT=$(yt-dlp $P -f bestaudio -o "/tmp/$mode-full.%(ext)s" "$U" 2>&1 | grep -E "ERROR|WARNING|100%" | tail -2 | tr '\n' ' ' | cut -c1-300)
            echo "::notice::[$mode full] $OUT | files: $(ls -la /tmp/$mode-full.* 2>/dev/null | awk '{print $5}' | tr '\n' ' ')"
            OUT=$(yt-dlp $P -f bestaudio --download-sections "*0-600" -o "/tmp/$mode-sec.%(ext)s" "$U" 2>&1 | grep -E "ERROR|WARNING" | tail -2 | tr '\n' ' ' | cut -c1-300)
            echo "::notice::[$mode section] $OUT | files: $(ls -la /tmp/$mode-sec.* 2>/dev/null | awk '{print $5}' | tr '\n' ' ')"
          done
