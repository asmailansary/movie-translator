# يشتغل لما الـ Worker في Cloudflare يطلب ترجمة فلم
name: translate
run-name: ترجمة فلم

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      video_id:
        required: true
        type: string
      source:
        required: false
        default: auto
        type: string
      dialect:
        required: false
        default: najdi
        type: string
      callback:
        required: true
        type: string

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # يخبر الصفحة إن GitHub بدأ (قبل تثبيت الأدوات)
      - name: إبلاغ الصفحة بالبدء
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK: ${{ inputs.callback }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          curl -sS -m 20 -X POST "$CALLBACK/api/ingest/$JOB_ID" \
            -H "Content-Type: application/json" -H "X-Ingest-Secret: $INGEST_SECRET" \
            -d '{"status":"running","stage":"GitHub بدأ… يجهّز الأدوات","progress":0.02}' || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp يحتاج deno عشان يقرأ يوتيوب
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ffmpeg جاهز (نسخة ثابتة سريعة بدل apt-get البطيء)
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: تثبيت yt-dlp
        timeout-minutes: 5
        run: pip install -q -U "yt-dlp[default]"

      - name: تحميل وتفريغ وترجمة
        # المدخلات تمر كمتغيرات بيئة (مو داخل السكربت) عشان الأمان
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          SOURCE: ${{ inputs.source }}
          DIALECT: ${{ inputs.dialect }}
          CALLBACK: ${{ inputs.callback }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python pipeline/translate.py
