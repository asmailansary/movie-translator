# يشتغل لما الـ Worker في Cloudflare يطلب ترجمة فلم
name: translate
run-name: ترجمة فلم

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      video_id:
        required: true
        type: string
      source:
        required: false
        default: auto
        type: string
      dialect:
        required: false
        default: najdi
        type: string
      callback:
        required: true
        type: string

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # يخبر الصفحة إن GitHub بدأ (قبل تثبيت الأدوات)
      - name: إبلاغ الصفحة بالبدء
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK: ${{ inputs.callback }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          curl -sS -m 20 -X POST "$CALLBACK/api/ingest/$JOB_ID" \
            -H "Content-Type: application/json" -H "X-Ingest-Secret: $INGEST_SECRET" \
            -d '{"status":"running","stage":"GitHub بدأ… يجهّز الأدوات","progress":0.02}' || true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp يحتاج deno عشان يقرأ يوتيوب
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # ffmpeg جاهز (نسخة ثابتة سريعة بدل apt-get البطيء)
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: تثبيت yt-dlp
        timeout-minutes: 5
        run: pip install -q -U "yt-dlp[default]" "urllib3[socks]"

      # يوتيوب يمنع عناوين GitHub؛ WARP يخلي طلبات يوتيوب تطلع من Cloudflare
      # (وضع proxy: يمر منه يوتيوب بس، وباقي اتصالات GitHub تبقى عادية)
      - name: تشغيل Cloudflare WARP
        timeout-minutes: 4
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/cloudflare-client.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y -qq --no-install-recommends cloudflare-warp
          sudo systemctl start warp-svc || true
          for i in $(seq 1 10); do warp-cli --accept-tos status >/dev/null 2>&1 && break; sleep 1; done
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 20); do warp-cli --accept-tos status | grep -q Connected && break; sleep 2; done
          if curl -s -m 15 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
            echo "YTDLP_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
            echo "✓ WARP شغّال"
          else
            echo "::warning::WARP ما اشتغل، بنحمّل مباشرة"
          fi

      - name: تحميل وتفريغ وترجمة
        # المدخلات تمر كمتغيرات بيئة (مو داخل السكربت) عشان الأمان
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          SOURCE: ${{ inputs.source }}
          DIALECT: ${{ inputs.dialect }}
          CALLBACK: ${{ inputs.callback }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python pipeline/translate.py
