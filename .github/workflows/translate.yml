# يشتغل لما الـ Worker في Cloudflare يطلب ترجمة فلم
name: translate
run-name: ترجمة فلم

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      video_id:
        required: true
        type: string
      source:
        required: false
        default: auto
        type: string
      dialect:
        required: false
        default: najdi
        type: string
      callback:
        required: true
        type: string
      reuse:
        required: false
        default: "0"
        type: string
      media_url:
        required: false
        default: ""
        type: string
      kind:
        required: false
        default: movie
        type: string

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # يخبر الصفحة إن GitHub بدأ (قبل تثبيت الأدوات)
      - name: إبلاغ الصفحة بالبدء
        env:
          JOB_ID: ${{ inputs.job_id }}
          CALLBACK: ${{ inputs.callback }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -X POST "$CALLBACK/api/ingest/$JOB_ID" \
            -H "Content-Type: application/json" -H "X-Ingest-Secret: $INGEST_SECRET" \
            -d '{"status":"running","stage":"بدأنا نجهّز الفلم 🎬","progress":0.02}' || true)
          echo "::notice::start report HTTP $CODE"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # yt-dlp يحتاج deno عشان يقرأ يوتيوب
      - uses: denoland/setup-deno@v2
        if: inputs.reuse != '1'
        with:
          deno-version: v2.x

      # ffmpeg جاهز (نسخة ثابتة سريعة بدل apt-get البطيء)
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: inputs.reuse != '1'
        with:
          ffmpeg-version: release

      - name: تثبيت yt-dlp
        if: inputs.reuse != '1'
        timeout-minutes: 5
        run: pip install -q -U "yt-dlp[default]" "urllib3[socks]"

      # يوتيوب يمنع عناوين GitHub أحياناً؛ WARP يخلي طلبات يوتيوب تطلع من Cloudflare
      # (wgcf + wireproxy: برامج جاهزة بدون apt، تشتغل في ثواني، ويمر منها يوتيوب بس)
      - name: تشغيل Cloudflare WARP
        if: inputs.reuse != '1'
        timeout-minutes: 3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd /tmp
          gh release download -R ViRb3/wgcf --pattern '*linux_amd64' -O wgcf --clobber
          gh release download -R whyvl/wireproxy --pattern '*linux_amd64.tar.gz' -O wp.tgz --clobber
          tar xzf wp.tgz wireproxy
          chmod +x wgcf wireproxy
          yes | ./wgcf register --accept-tos >/dev/null
          ./wgcf generate >/dev/null
          printf 'WGConfig = /tmp/wgcf-profile.conf\n\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' > wp.conf
          nohup ./wireproxy -c wp.conf > wp.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s -m 5 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
              echo "YTDLP_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"
              echo "::notice::WARP شغّال"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::WARP ما اشتغل: $(tail -3 wp.log | tr '\n' ' ')"

      - name: تحميل وتفريغ وترجمة
        # المدخلات تمر كمتغيرات بيئة (مو داخل السكربت) عشان الأمان
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          SOURCE: ${{ inputs.source }}
          DIALECT: ${{ inputs.dialect }}
          CALLBACK: ${{ inputs.callback }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          REUSE: ${{ inputs.reuse }}
          MEDIA_URL: ${{ inputs.media_url }}
          KIND: ${{ inputs.kind }}
        run: python pipeline/translate.py
