# ينسخ الكود تلقائياً من GitHub إلى Hugging Face Space مع كل تحديث
name: Sync to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::HF_TOKEN أو HF_SPACE لسا ما انضافوا في إعدادات المستودع"
            exit 0
          fi
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
